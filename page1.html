<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1С + IzoGlass — ЛЕГКИЙ учет</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Arial', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .slide { 
            width: 100vw; height: 100vh; 
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            text-align: center; padding: 20px; 
            position: relative; 
            background: rgba(255,255,255,0.95);
        }
        h1 { 
            font-size: 2.5rem; 
            margin: 0 0 10px 0; 
            color: #0277bd; 
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            line-height: 1.2;
        }
        p { 
            font-size: 1.3rem; 
            line-height: 1.3; 
            margin: 8px 0; 
            color: #333;
        }
        .big-emoji { font-size: 2.5rem; }
        .contact { 
            font-size: 1.1rem; 
            background: #ffeb3b; 
            padding: 12px; 
            border-radius: 15px; 
            margin-top: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            line-height: 1.3; 
            text-align: left;
            display: inline-block;
        }
        .contact-grid {
            display: grid;
            grid-template-columns: auto auto auto;
            gap: 8px;
            align-items: center;
            justify-items: start;
            font-weight: 600;
        }
        .navigation {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 1000;
        }
        .nav-btn {
            padding: 8px 16px;
            background: #0277bd;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .nav-btn:hover {
            background: #01579b;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .page-nav-counter {
            color: white;
            font-size: 14px;
            font-weight: bold;
            background: #0277bd;
            padding: 8px 12px;
            border-radius: 18px;
            display: flex;
            align-items: center;
        }
        .logo {
            max-width: 120px;
            max-height: 50px;
            margin: 10px auto;
            display: block;
        }
        .nav-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .page-counter {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        /* Мобильная адаптивность */
        @media (max-width: 768px) {
            .slide {
                padding: 15px;
            }
            h1 { 
                font-size: 1.8rem;
                margin-bottom: 8px;
            }
            p { 
                font-size: 1rem; 
            }
            .big-emoji { font-size: 1.8rem; }
            .contact { 
                font-size: 0.9rem; 
                padding: 10px;
                margin-top: 12px;
            }
            .navigation {
                gap: 10px;
                bottom: 15px;
            }
            .nav-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
            .page-nav-counter {
                font-size: 12px;
                padding: 6px 10px;
            }
            .page-counter {
                font-size: 12px;
                padding: 6px 10px;
                top: 15px;
                right: 15px;
            }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.5rem; }
            p { font-size: 0.9rem; }
            .big-emoji { font-size: 1.5rem; }
            .contact { 
                font-size: 0.8rem;
                padding: 8px;
            }
            .contact-grid {
                gap: 6px;
            }
        }
    </style>
</head>
<body>

<div class="slide">
    <h1>1С + IzoGlass = ЛЕГКИЙ учет!</h1>
    <p>Для окон, стеклопакетов, дверей.</p>
    <div class="contact">
        <div class="contact-grid">
            <span>Андрей</span><span>|</span><span>+7-926-203-00-25</span>
            <span>Артем</span><span>|</span><span>+7-920-254-42-39</span>
        </div>
    </div>
</div>

<div class="navigation">
    <span class="page-nav-counter">1 / 10</span>
    <a href="page2.html" class="nav-btn">Далее →</a>
</div>

</body>
</html>
