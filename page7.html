<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1С + IzoGlass — ЛЕГКИЙ учет</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Arial', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .slide { 
            width: 100vw; height: 100vh; 
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            text-align: center; padding: 40px; 
            position: relative; 
            background: rgba(255,255,255,0.95);
        }
        h2 { font-size: 2.2rem; margin: 12px 0; color: #01579b; }
        p { font-size: 1.3rem; line-height: 1.3; margin: 8px 0; }
        .big-emoji { font-size: 2.5rem; }
        
        /* Мобильная адаптивность */
        @media (max-width: 768px) {
            .slide { padding: 15px; }
            h2 { font-size: 1.6rem; margin: 10px 0; }
            p { font-size: 1rem; }
            .big-emoji { font-size: 1.8rem; }
            .navigation { gap: 10px; bottom: 15px; }
            .nav-btn { padding: 6px 12px; font-size: 12px; }
            .page-nav-counter { font-size: 12px; padding: 6px 10px; }
            .page-counter { font-size: 12px; padding: 6px 10px; top: 15px; right: 15px; }
        }
        
        @media (max-width: 480px) {
            h2 { font-size: 1.4rem; }
            p { font-size: 0.9rem; }
            .big-emoji { font-size: 1.5rem; }
        }
        .navigation {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 1000;
        }
        .nav-btn {
            padding: 10px 20px;
            background: #0277bd;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .nav-btn:hover {
            background: #01579b;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .page-nav-counter {
            color: white;
            font-size: 18px;
            font-weight: bold;
            background: #0277bd;
            padding: 10px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
        }
        .page-counter {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="page-counter">7 / 10</div>

<div class="slide">
    <h2>Работает на заводах! <span class="big-emoji">🏭</span></h2>
    <p style="font-size: 1.5rem;">Н.Новгород: -10% затрат <span class="big-emoji">😄</span></p>
    <p style="font-size: 1.5rem;">Москва: +15% прибыли! <span class="big-emoji">💵</span></p>
    <p>Попробуй сам — увидишь! <span class="big-emoji">👀✅</span></p>
</div>

<div class="navigation">
    <a href="page6.html" class="nav-btn">← Назад</a>
    <span class="page-nav-counter">7 / 10</span>
    <a href="page8.html" class="nav-btn">Далее →</a>
</div>

</body>
</html>
