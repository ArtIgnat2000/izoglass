<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1С + IzoGlass — ЛЕГКИЙ учет</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Arial', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .slide { 
            width: 100vw; height: 100vh; 
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            text-align: center; padding: 40px; 
            position: relative; 
            background: rgba(255,255,255,0.95);
        }
        h1 { font-size: 2.5rem; margin: 0 0 12px 0; color: #0277bd; text-shadow: 3px 3px 6px rgba(0,0,0,0.3); line-height: 1.2; }
        ol { list-style-position: inside; max-width: 85%; }
        li { margin: 12px 0; font-size: 1.4rem; }
        .big-emoji { font-size: 2.5rem; }
        
        /* Мобильная адаптивность */
        @media (max-width: 768px) {
            .slide { padding: 15px; }
            h1 { font-size: 1.8rem; margin-bottom: 8px; }
            li { font-size: 1rem; margin: 8px 0; }
            .big-emoji { font-size: 1.8rem; }
            ol { max-width: 95%; }
            .navigation { gap: 10px; bottom: 15px; }
            .nav-btn { padding: 6px 12px; font-size: 12px; }
            .page-nav-counter { font-size: 12px; padding: 6px 10px; }
            .page-counter { font-size: 12px; padding: 6px 10px; top: 15px; right: 15px; }
        }
        
        @media (max-width: 480px) {
            h1 { font-size: 1.5rem; }
            li { font-size: 0.9rem; }
            .big-emoji { font-size: 1.5rem; }
            .contact {
                font-size: 0.8rem;
                padding: 8px;
            }
            .action-list {
                font-size: 0.8rem;
                max-width: 98%;
            }
        }
        .contact { 
            font-size: 1.1rem; 
            background: #ffeb3b; 
            padding: 12px; 
            border-radius: 15px; 
            margin-top: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            line-height: 1.3; 
            text-align: left;
            display: inline-block;
        }
        .contact-grid {
            display: grid;
            grid-template-columns: auto auto auto;
            gap: 10px;
            align-items: center;
            justify-items: start;
        }
        .action-list {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 10px;
            align-items: center;
            max-width: 90%;
            text-align: left;
            font-size: 1.1rem;
        }
        .action-number {
            justify-self: end;
            font-weight: bold;
        }
        .action-text {
            justify-self: start;
        }
        .action-emoji {
            justify-self: center;
        }
        .navigation {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 1000;
        }
        .nav-btn {
            padding: 10px 20px;
            background: #0277bd;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .nav-btn:hover {
            background: #01579b;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .page-nav-counter {
            color: white;
            font-size: 18px;
            font-weight: bold;
            background: #0277bd;
            padding: 10px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
        }
        .page-counter {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="page-counter">9 / 10</div>

<div class="slide">
    <h1>Давай сейчас!</h1>
    <div class="action-list">
        <span class="action-number">1.</span>
        <span class="action-text">Позвони!</span>
        <span class="action-emoji big-emoji">📞</span>
        
        <span class="action-number">2.</span>
        <span class="action-text">Согласуем план</span>
        <span class="action-emoji big-emoji">📋</span>
        
        <span class="action-number">3.</span>
        <span class="action-text">Запустим + научим</span>
        <span class="action-emoji big-emoji">🚀</span>
        
        <span class="action-number">4.</span>
        <span class="action-text">Поддержка и консультации</span>
        <span class="action-emoji big-emoji">🛠️</span>
    </div>
    <div class="contact">ЗВОНИ: <span class="big-emoji">📞</span>
        <div class="contact-grid">
            <span>Андрей</span><span>|</span><span>+7-926-203-00-25</span>
            <span>Артем</span><span>|</span><span>+7-920-254-42-39</span>
        </div>
    </div>
</div>

<div class="navigation">
    <a href="page8.html" class="nav-btn">← Назад</a>
    <span class="page-nav-counter">9 / 10</span>
    <a href="page10.html" class="nav-btn">Далее →</a>
</div>

</body>
</html>
