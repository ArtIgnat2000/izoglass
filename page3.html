<!DOCTYPE html>
<html lang="ru">
<head>

    <title>1С + IzoGlass — ЛЕГКИЙ учет</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Arial', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .slide { 
            width: 100vw; height: 100vh; 
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            text-align: center; padding: 40px; 
            position: relative; 
            background: rgba(255,255,255,0.95);
        }
        h1 { font-size: 3.5vw; margin: 0 0 15px 0; color: #0277bd; text-shadow: 3px 3px 6px rgba(0,0,0,0.3); }
        p { font-size: 2.2vw; line-height: 1.3; margin: 10px 0; }
        .big-emoji { font-size: 4vw; }
        .navigation {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 1000;
        }
        .nav-btn {
            padding: 10px 20px;
            background: #0277bd;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .nav-btn:hover {
            background: #01579b;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .page-nav-counter {
            color: white;
            font-size: 18px;
            font-weight: bold;
            background: #0277bd;
            padding: 10px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
        }
        .page-counter {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="page-counter">3 / 10</div>

<div class="slide">
    <h1>Магия одной кнопки! <span class="big-emoji">✨</span></h1>
    <p><span class="big-emoji">⬅️</span> IzoGlass ➡️ 1С <span class="big-emoji">🔄</span></p>
    <p style="font-size: 4vw;">Все документы прыгают сами!</p>
    <p>1 клик — и готово! <span class="big-emoji">🪄😊</span></p>
</div>

<div class="navigation">
