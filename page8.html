<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1С + IzoGlass — ЛЕГКИЙ учет</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Arial', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .slide { 
            width: 100vw; height: 100vh; 
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            text-align: center; padding: 40px; 
            position: relative; 
            background: linear-gradient(45deg, #81d4fa, #4fc3f7);
        }
        h1 { font-size: 3.5vw; margin: 0 0 15px 0; color: #0277bd; text-shadow: 3px 3px 6px rgba(0,0,0,0.3); }
        p { font-size: 2.2vw; line-height: 1.3; margin: 10px 0; }
        .big-emoji { font-size: 4vw; }
        .results-grid {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 15px;
            align-items: center;
            max-width: 80%;
            text-align: left;
            margin: 15px 0;
        }
        .results-text {
            font-size: 2.8vw;
            text-align: left;
        }
        .results-emoji {
            justify-self: center;
        }
        .navigation {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 1000;
        }
        .nav-btn {
            padding: 10px 20px;
            background: #0277bd;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .nav-btn:hover {
            background: #01579b;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .page-nav-counter {
            color: white;
            font-size: 18px;
            font-weight: bold;
            background: #0277bd;
            padding: 10px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
        }
        .page-counter {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="page-counter">8 / 10</div>

<div class="slide">
    <h1>Деньги вернутся быстро! <span class="big-emoji">📊</span></h1>
    <div class="results-grid">
        <span class="results-text">Прибыль В ПЛЮС!</span>
        <span class="results-emoji big-emoji">🚀</span>
        <span class="results-text">Издержки в МИНУС!</span>
        <span class="results-emoji big-emoji">🔻</span>
    </div>
    <p><span class="big-emoji">💰</span> График: деньги растут!</p>
</div>

<div class="navigation">
    <a href="page7.html" class="nav-btn">← Назад</a>
    <span class="page-nav-counter">8 / 10</span>
    <a href="page9.html" class="nav-btn">Далее →</a>
</div>

</body>
</html>
